- pipeline: openutaumobile
  name: OpenUtauMobile
  refs:
  - refs/heads/dev
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  arch: ARM64
  actions:
  - action: dotnet build
    type: BUILD
    execute_commands:
    - dotnet restore
    - dotnet build
    shell: BASH
    docker_image_name: dotnet/core/sdk
    docker_image_tag: 3.1
    image_location: PUBLIC_REGISTRY
    docker_registry: OTHER
    registry: mcr.microsoft.com
